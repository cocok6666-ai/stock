name: night-futures
on:
  schedule:
    - cron: '10,25,40,55 21 * * 1-5'
    - cron: '10,25,40,55 22 * * 1-5'
    - cron: '10,40 23 * * 1-5'
    - cron: '10 0,1,2,3 * * 1-6'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: night
  cancel-in-progress: false
jobs:
  night:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fetch_night.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add night.json 2>/dev/null || { echo "기록할 값 없음"; exit 0; }
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -qm "night.json 갱신(야간선물 마감 자동수집)"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
