name: screen
on:
  schedule:
    - cron: '30 21 * * 0-4'   # 평일 06:30 KST — 국내+미국 전체(전 거래일 종가 기준)
    - cron: '10 6 * * 1-5'    # 평일 15:10 KST — 국내만 재계산(장 마감 직전 값 반영)
  workflow_dispatch:
    inputs:
      mode:
        description: 'kr | us | all'
        default: 'all'
      limit:
        description: '시장별 종목 수 제한(시험용, 0=전체)'
        default: '0'
permissions:
  contents: write
concurrency:
  group: screen
  cancel-in-progress: false
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 계산
        env:
          LIMIT: ${{ github.event.inputs.limit || '0' }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "10 6 * * 1-5" ]; then MODE=kr; else MODE=all; fi
          fi
          echo "mode=$MODE"
          node scripts/screen.js "$MODE"
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.json
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -qm "stats.json 갱신(종목 3관점 스크리닝)"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
