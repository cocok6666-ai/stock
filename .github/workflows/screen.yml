name: screen
on:
  schedule:
    - cron: '10 6 * * 1-5'    # 평일 15:10 KST — 국내 분석통계 게시
    - cron: '50 20 * * 1-5'   # 미국 마감 10분 전 (겨울 05:50 KST, EST)
    - cron: '50 19 * * 1-5'   # 미국 마감 10분 전 (여름 04:50 KST, EDT)
  workflow_dispatch:
    inputs:
      mode:
        description: 'kr | us | all'
        default: 'all'
      limit:
        description: '시장별 종목 수 제한(시험용, 0=전체)'
        default: '0'
permissions:
  contents: write
concurrency:
  group: screen
  cancel-in-progress: false
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: 서머타임 확인
        id: gate
        run: |
          s="${{ github.event.schedule }}"; off=$(TZ=America/New_York date +%z); run=1
          if [ "$s" = "50 20 * * 1-5" ] && [ "$off" != "-0500" ]; then run=0; fi
          if [ "$s" = "50 19 * * 1-5" ] && [ "$off" != "-0400" ]; then run=0; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.run == '1'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 계산
        if: steps.gate.outputs.run == '1'
        env:
          LIMIT: ${{ github.event.inputs.limit || '0' }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "10 6 * * 1-5" ]; then MODE=kr; elif [ -n "${{ github.event.schedule }}" ]; then MODE=us; else MODE=all; fi
          fi
          echo "mode=$MODE"
          node scripts/screen.js "$MODE"
      - if: steps.gate.outputs.run == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.json
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -qm "stats.json 갱신(종목 3관점 스크리닝)"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
