name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          python3 - <<'PY'
          import json,urllib.request
          UA={"User-Agent":"Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 Mobile Safari/604.1","Accept":"application/json"}
          def g(u):
              try:
                  return json.loads(urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=15).read().decode())
              except Exception as e: return {"ERR":str(e)}
          def show(n,j):
              print("=====",n)
              if "ERR" in j: print(j); return
              for k,v in j.items():
                  if k in("stockEndType","itemCode","stockName","closePrice","localTradedAt","marketStatus","compareToPreviousClosePrice","fluctuationsRatio") or "ver" in k.lower() or "nxt" in k.lower() or "pre" in k.lower() or "after" in k.lower():
                      print(k,"=",json.dumps(v,ensure_ascii=False)[:700])
          j=g("https://polling.finance.naver.com/api/realtime/domestic/stock/005930")
          print("POLL",json.dumps(j,ensure_ascii=False)[:2500])
          b=g("https://m.stock.naver.com/api/stock/005930/basic")
          print("BASIC",json.dumps(b,ensure_ascii=False)[:2500])
          t=g("https://m.stock.naver.com/api/stock/005930/integration")
          print("INTEG tradeInfo/dealTrend keys",[k for k in t.keys()])
          for k in ("totalInfos","dealTrendInfos"):
              print(k,json.dumps(t.get(k),ensure_ascii=False)[:1500])
          e=g("https://m.stock.naver.com/api/stock/069500/basic")
          print("ETF069500",json.dumps({k:e.get(k) for k in ("closePrice","localTradedAt","marketStatus","overMarketPriceInfo")},ensure_ascii=False))
          idx=g("https://m.stock.naver.com/api/index/KOSPI/basic")
          print("KOSPIidx",json.dumps({k:idx.get(k) for k in ("closePrice","localTradedAt","marketStatus","overMarketPriceInfo")},ensure_ascii=False))
          PY
