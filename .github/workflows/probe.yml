name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY' > out.txt
          import urllib.request as u
          H={"User-Agent":"Mozilla/5.0"}
          c=["https://api.stock.naver.com/marketindex/energy/OIL_DU","https://api.stock.naver.com/marketindex/energy/DUBAI_OIL","https://api.stock.naver.com/marketindex/energy/DBCM","https://api.stock.naver.com/marketindex/energy/DCOILDU","https://api.stock.naver.com/marketindex/energy","https://api.stock.naver.com/marketindex/energy/list","https://api.stock.naver.com/marketindex/category/energy","https://api.stock.naver.com/marketindex/energy/OIL_DU/basic","https://api.stock.naver.com/marketindex/energy/CLcv1","https://m.stock.naver.com/api/marketindex/energy/OIL_DU","https://m.stock.naver.com/front-api/marketIndex/productDetail?category=energy&reutersCode=OIL_DU","https://m.stock.naver.com/front-api/marketIndex/prices?category=energy&reutersCode=OIL_DU"]
          for x in c:
            try:
              r=u.urlopen(u.Request(x,headers=H),timeout=15).read().decode()[:600];print("OK",x,r)
            except Exception as e: print("ERR",x,e)
          PY
          git config user.name b; git config user.email b@b
          git checkout -q --orphan probe; git rm -rfq . ; mv out.txt probe.txt; git add probe.txt; git commit -qm p; git push -qf origin probe
