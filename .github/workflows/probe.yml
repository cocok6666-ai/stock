name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY' > out.txt
          import urllib.request as u,json
          H={"User-Agent":"Mozilla/5.0","Referer":"https://m.stock.naver.com/"}
          def get(x):
            try:
              r=u.urlopen(u.Request(x,headers=H),timeout=25).read().decode();return json.loads(r)
            except Exception as e: print("ERR",x,e);return None
          for sz in (20,30,40,50,60,100):
            for base in ("https://m.stock.naver.com/api/stock/005930/price","https://api.stock.naver.com/stock/NVDA.O/price"):
              j=get(base+"?pageSize=%d&page=1"%sz)
              print(sz,base[-22:],len(j) if j else None)
          j=get("https://m.stock.naver.com/api/stock/005930/price?pageSize=3&page=1");print(json.dumps(j,ensure_ascii=False)[:700])
          j=get("https://api.stock.naver.com/stock/NVDA.O/price?pageSize=3&page=2");print(json.dumps(j,ensure_ascii=False)[:300])
          for x in ["https://m.stock.naver.com/api/stock/005930/finance/annual","https://api.stock.naver.com/stock/NVDA.O/finance/annual","https://api.stock.naver.com/stock/NVDA.O/finance/quarter"]:
            j=get(x);fi=j.get("financeInfo",j);print(x[-34:],[r["title"] for r in fi["rowList"]])
          PY
          git config user.name b; git config user.email b@b
          git checkout -q --orphan probe; git rm -rfq . ; mv out.txt probe.txt; git add probe.txt; git commit -qm p; git push -qf origin probe
