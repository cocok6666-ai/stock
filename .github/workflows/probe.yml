name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in "https://api.stock.naver.com/marketindex/cryptocurrency/BTC" "https://api.stock.naver.com/marketindex/crypto/BTC" "https://m.stock.naver.com/front-api/marketIndex/productDetail?category=crypto&reutersCode=BTC" "https://query1.finance.yahoo.com/v8/finance/chart/BTC-USD?range=1d&interval=5m" "https://api.binance.com/api/v3/ticker/24hr?symbol=BTCUSDT" "https://api.coinbase.com/v2/prices/BTC-USD/spot" "https://api.upbit.com/v1/ticker?markets=KRW-BTC" "https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd&include_24hr_change=true"; do
            echo "== $u"; curl -s -m 15 -A "Mozilla/5.0" -w "\nHTTP %{http_code}\n" "$u" | cut -c1-500
          done
