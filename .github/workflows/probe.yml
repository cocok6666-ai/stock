name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir /tmp/o && cd /tmp/o
          for u in "https://m.stock.naver.com/api/index/KOSPI/basic" "https://polling.finance.naver.com/api/realtime/domestic/stock/005930" "https://api.stock.naver.com/index/.DJI/basic" "https://api.stock.naver.com/marketindex/exchange/FX_USDKRW" "https://api.stock.naver.com/stock/NVDA.O/basic"; do
            echo "== $u" >> h.txt
            curl -sS -D - -o /dev/null -H "Origin: https://cocok6666-ai.github.io" -H "User-Agent: Mozilla/5.0" "$u" | grep -i -E "^HTTP|access-control|vary" >> h.txt
            curl -sS -D - -o /dev/null -X OPTIONS -H "Origin: https://cocok6666-ai.github.io" -H "Access-Control-Request-Method: GET" -H "User-Agent: Mozilla/5.0" "$u" | grep -i -E "^HTTP|access-control" | sed 's/^/OPT /' >> h.txt
          done
          git init -q -b probe && git config user.name b && git config user.email b@x.y
          git add . && git commit -q -m probe
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" probe
