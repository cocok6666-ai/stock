name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY' > out.txt
          import urllib.request as u,urllib.parse as p,json,re
          def get(x,hd=None):
            h={"User-Agent":"Mozilla/5.0"};h.update(hd or {})
            try: return u.urlopen(u.Request(x,headers=h),timeout=25).read().decode("utf-8","replace")
            except Exception as e: print("ERR",x,e);return ""
          r=get("https://news.google.com/rss/search?q="+p.quote("야간선물 마감 코스피200")+"&hl=ko&gl=KR&ceid=KR:ko")
          for m in re.finditer(r"<item><title>(.*?)</title>.*?<pubDate>(.*?)</pubDate>",r,re.S): print(m.group(2),"|",m.group(1))
          print("---DAUM")
          h=get("https://finance.daum.net/domestic",{"Referer":"https://finance.daum.net/"})
          print(len(h))
          js=re.findall(r'src="([^"]+\.js)"',h);print(js[:8])
          for s in js[:8]:
            s=p.urljoin("https://finance.daum.net/",s);t=get(s)
            for m in re.finditer(r"[\w/\-\.]*(?:futures|night|FUT)[\w/\-\.\?=&]*",t,re.I):
              print(s[-30:],m.group(0)[:100])
          for x in ["https://finance.daum.net/api/domestic/futures","https://finance.daum.net/api/quotes/FUT","https://finance.daum.net/api/market_index/futures","https://finance.daum.net/api/domestic/market/futures"]:
            t=get(x,{"Referer":"https://finance.daum.net/"});print(x,len(t),t[:200])
          PY
          git config user.name b; git config user.email b@b
          git checkout -q --orphan probe; git rm -rfq . ; mv out.txt probe.txt; git add probe.txt; git commit -qm p; git push -qf origin probe
