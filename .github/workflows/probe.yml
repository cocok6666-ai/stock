name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY' > out.txt
          import urllib.request as u,json,datetime
          def post(url,body):
            try:
              r=u.urlopen(u.Request(url,data=json.dumps(body).encode(),headers={"User-Agent":"Mozilla/5.0","Content-Type":"application/json","Origin":"https://www.tradingview.com","Referer":"https://www.tradingview.com/"}),timeout=25).read().decode();return json.loads(r)
            except Exception as e: print("ERR",url,e);return None
          cols=["name","description","close","change","change_abs","time","update_mode","exchange","type","subtype"]
          for tk in ["KRX:K2I1!","KRX:K200I1!","KRX:KS200","KRX:KOSPI200","KRX:101W3000","KRX:K2I2!"]:
            r=post("https://scanner.tradingview.com/futures/scan",{"symbols":{"tickers":[tk]},"columns":cols})
            print(tk,json.dumps(r,ensure_ascii=False)[:400] if r else r)
          # 이름 검색
          r=post("https://scanner.tradingview.com/futures/scan",{"filter":[{"left":"exchange","operation":"equal","right":"KRX"}],"columns":cols,"range":[0,60],"sort":{"sortBy":"name","sortOrder":"asc"}})
          if r:
            print("KRX futures total",r.get("totalCount"))
            for d in r.get("data",[])[:60]:
              t=d["d"];print(d["s"],t[1],t[2],t[3],datetime.datetime.utcfromtimestamp(t[5]).strftime("%m-%d %H:%M") if t[5] else None)
          PY
          git config user.name b; git config user.email b@b
          git checkout -q --orphan probe; git rm -rfq . ; mv out.txt probe.txt; git add probe.txt; git commit -qm p; git push -qf origin probe
