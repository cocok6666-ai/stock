name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY' > out.txt
          import urllib.request as u,json
          H={"User-Agent":"Mozilla/5.0"}
          for cat in ["energy","metals"]:
            j=json.loads(u.urlopen(u.Request("https://api.stock.naver.com/marketindex/"+cat,headers=H),timeout=15).read())
            for x in j: print(cat,x.get("reutersCode"),x.get("name"),x.get("fullName"),x.get("closePrice"))
          PY
          git config user.name b; git config user.email b@b
          git checkout -q --orphan probe; git rm -rfq . ; mv out.txt probe.txt; git add probe.txt; git commit -qm p; git push -qf origin probe
