name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY' > out.txt
          import urllib.request as u,urllib.parse as p,json,re
          H={"User-Agent":"Mozilla/5.0","Referer":"https://m.stock.naver.com/"}
          def get(x,n=1500,hd=H):
            try:
              r=u.urlopen(u.Request(x,headers=hd),timeout=20).read().decode("utf-8","replace")
              print("OK",x,len(r));return r
            except Exception as e:
              print("ERR",x,e);return ""
          for x in ["https://m.stock.naver.com/api/index/FUT/integration","https://m.stock.naver.com/api/index/FUT/basic"]:
            r=get(x);print(r[:1200]);print("night/야간 hits:",[m.start() for m in re.finditer("night|Night|야간",r)][:5]);print()
          for q in ["야간선물","코스피200야간","KOSPI200 야간"]:
            r=get("https://ac.stock.naver.com/ac?q="+p.quote(q)+"&target=index,stock,marketindicator");print(r[:800])
          for x in ["https://finance.naver.com/sise/sise_index.naver?code=FUT","https://finance.naver.com/sise/","https://finance.naver.com/sise/sise_futures.naver","https://finance.naver.com/sise/nightFutures.naver"]:
            r=get(x,hd={"User-Agent":"Mozilla/5.0"});
            for m in re.finditer("야간",r): print("  ..",r[max(0,m.start()-150):m.start()+200].replace("\n"," "));break
          PY
          git config user.name b; git config user.email b@b
          git checkout -q --orphan probe; git rm -rfq . ; mv out.txt probe.txt; git add probe.txt; git commit -qm p; git push -qf origin probe
