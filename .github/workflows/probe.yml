name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 scripts/probe.py /tmp/probe.json
          mkdir /tmp/o && cp /tmp/probe.json /tmp/o/ && cd /tmp/o
          git init -q -b probe && git config user.name b && git config user.email b@x.y
          git add . && git commit -q -m probe
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" probe
