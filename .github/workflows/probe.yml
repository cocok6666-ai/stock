name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for c in .SOX SOX .SOXX; do
            curl -sS -m 25 -o /tmp/s.json -w "$c %{http_code}\n" -H "User-Agent: Mozilla/5.0" "https://api.stock.naver.com/index/$c/basic" || true
            head -c 450 /tmp/s.json; echo
          done
