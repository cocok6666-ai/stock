name: probe
on: workflow_dispatch
permissions:
  contents: write
concurrency:
  group: probe
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir /tmp/o && cd /tmp/o
          R=https://raw.githubusercontent.com/cocok6666-ai/stock/data/quotes.json
          for q in "?_=$RANDOM" "?_=$RANDOM" "" ; do
            echo "== raw$q" >> h.txt
            curl -sS -D h1 -o b1 -H "Origin: https://cocok6666-ai.github.io" "$R$q"
            grep -i -E "^HTTP|cache-control|age:|x-cache|access-control-allow-origin|etag|expires|x-served" h1 >> h.txt
            grep -m1 '"updated"' b1 >> h.txt
          done
          echo "== now $(TZ=Asia/Seoul date +%T)" >> h.txt
          echo "== api contents" >> h.txt
          curl -sS -D h2 -o b2 -H "Origin: https://cocok6666-ai.github.io" -H "Accept: application/vnd.github.raw" "https://api.github.com/repos/cocok6666-ai/stock/contents/quotes.json?ref=data&_=$RANDOM"
          grep -i -E "^HTTP|cache-control|access-control-allow-origin|x-ratelimit-limit|x-ratelimit-remaining" h2 >> h.txt
          grep -m1 '"updated"' b2 >> h.txt
          git init -q -b probe && git config user.name b && git config user.email b@x.y
          git add h.txt && git commit -q -m probe
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" probe
