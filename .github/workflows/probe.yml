name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          python3 - <<'PY'
          import json,urllib.request
          UA={"User-Agent":"Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 Mobile Safari/604.1","Accept":"application/json"}
          def g(u):
              try:
                  return json.loads(urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=15).read().decode())
              except Exception as e: return {"ERR":str(e)}
          def show(n,j):
              print("=====",n)
              if "ERR" in j: print(j); return
              for k,v in j.items():
                  if k in("stockEndType","itemCode","stockName","closePrice","localTradedAt","marketStatus","compareToPreviousClosePrice","fluctuationsRatio") or "ver" in k.lower() or "nxt" in k.lower() or "pre" in k.lower() or "after" in k.lower():
                      print(k,"=",json.dumps(v,ensure_ascii=False)[:700])
          for u in ("https://m.stock.naver.com/api/stock/005930/price?pageSize=3&page=1","https://m.stock.naver.com/api/stock/000660/price?pageSize=2&page=1","https://m.stock.naver.com/api/stock/005930/price?pageSize=1&page=1&periodType=day"):
              print("PRICE",u,json.dumps(g(u),ensure_ascii=False)[:1200])
          print("NVDAprice",json.dumps(g("https://api.stock.naver.com/stock/NVDA.O/price?pageSize=2&page=1"),ensure_ascii=False)[:800])
          print("DAILYIDX",json.dumps(g("https://m.stock.naver.com/api/stock/005930/integration").get("totalInfos",[])[:2]))
          PY
