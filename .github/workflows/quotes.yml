name: quotes
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  actions: write
concurrency:
  group: quotes
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: 시세 수집 (장 시간에는 수집 후 5초 쉬고 반복(약 12~15초 주기), ~4.5분 동안)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          in_window() {
            d=$(TZ=Asia/Seoul date +%u); hm=$(TZ=Asia/Seoul date +%H%M); hm=$((10#$hm))
            # 월 06:50 ~ 토 06:50 연속(국내 NXT 프리·애프터, 미국 프리·정규·애프터 포함)
            if [ "$d" -le 5 ] && [ "$hm" -ge 650 ]; then return 0; fi
            if [ "$d" -ge 2 ] && [ "$d" -le 6 ] && [ "$hm" -lt 650 ]; then return 0; fi
            return 1
          }
          core() {  # 정규장 시간대는 촘촘히, 그 밖(NXT·프리·애프터)은 느슨하게
            d=$(TZ=Asia/Seoul date +%u); hm=$(TZ=Asia/Seoul date +%H%M); hm=$((10#$hm))
            if [ "$d" -le 5 ] && [ "$hm" -ge 850 ] && [ "$hm" -le 1545 ]; then return 0; fi
            if [ "$d" -le 5 ] && [ "$hm" -ge 2220 ]; then return 0; fi
            if [ "$d" -ge 2 ] && [ "$d" -le 6 ] && [ "$hm" -le 610 ]; then return 0; fi
            return 1
          }
          publish() {
            mkdir -p /tmp/keep
            cp /tmp/quotes.json "/tmp/keep/q$(( $(date +%s) / 15 )).json"
            ls -1t /tmp/keep | tail -n +9 | while read f; do rm -f "/tmp/keep/$f"; done
            rm -rf /tmp/out && mkdir /tmp/out && cp /tmp/keep/*.json /tmp/out/ && cp /tmp/quotes.json /tmp/out/quotes.json && cd /tmp/out
            git init -q -b data
            git config user.name "quotes-bot"; git config user.email "quotes-bot@users.noreply.github.com"
            git add . && git commit -q -m "quotes $(date -u +%FT%TZ)"
            git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" data || true
            cd "$GITHUB_WORKSPACE"
          }
          LIMIT=$((SECONDS+270))
          while true; do
            python3 scripts/fetch_quotes.py /tmp/quotes.json || true
            [ -s /tmp/quotes.json ] && publish
            in_window || exit 0
            [ "$SECONDS" -ge "$LIMIT" ] && break
            if core; then sleep 5; else sleep 40; fi
          done
          gh workflow run quotes.yml --ref main || true
      - name: 갱신 감시 (멈춘 작업 재실행)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/watchdog.py || true
