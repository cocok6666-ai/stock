name: quotes
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: quotes
  cancel-in-progress: true
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 시세 수집
        run: python3 scripts/fetch_quotes.py /tmp/quotes.json
      - name: data 브랜치에 저장 (이력 없이 1커밋 유지)
        run: |
          set -e
          mkdir /tmp/out && cp /tmp/quotes.json /tmp/out/quotes.json
          cd /tmp/out
          git init -q -b data
          git config user.name "quotes-bot"
          git config user.email "quotes-bot@users.noreply.github.com"
          git add quotes.json
          git commit -q -m "quotes $(date -u +%FT%TZ)"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin data
