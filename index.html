<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="주식보좌관">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<title>깨비주식 아침브리핑</title>
<style>
:root{--bg:#0b1220;--card:#121b2e;--tile:#0e1626;--line:#1f2b44;--tx:#e8edf7;--mut:#8b98b3;--up:#ff5a62;--dn:#4d8dff;--acc:#2dd4a7}
*{box-sizing:border-box;min-width:0}
html,body{overflow-x:hidden;width:100%;max-width:100vw}
.card,.sum,.memo,.gap,.hl{max-width:100%;overflow-wrap:anywhere}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:5;background:rgba(11,18,32,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hd{max-width:520px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px}
.logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#2dd4a7,#0ea5a4);display:grid;place-items:center;color:#06231d;font-weight:800;font-size:24px;flex:none}
.ttl{flex:1;min-width:0}
.ttl b{display:block;font-size:17px;letter-spacing:-.3px;white-space:nowrap}
.ttl span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl span{font-size:11.5px;color:var(--mut)}
.wrap{max-width:520px;margin:0 auto;padding:12px 12px 56px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:14px;overflow:hidden}
.card h2{margin:0;padding:12px 14px;font-size:15px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.card h2 i{font-style:normal;background:var(--acc);color:#06231d;border-radius:6px;font-size:11px;font-weight:800;padding:2px 7px}
.card h2 small{margin-left:auto;color:var(--mut);font-weight:500;font-size:11.5px}
.sum{padding:14px}
.card.csum{background:linear-gradient(135deg,#f6ecd9 0%,#ead8b6 55%,#dcc399 100%);border:1px solid #c9a86a;box-shadow:0 6px 22px rgba(201,168,106,.25),inset 0 1px 0 rgba(255,255,255,.6)}
.csum .hl{color:#2b2112;font-weight:800;font-size:16.5px;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.csum .gap{background:rgba(255,255,255,.55);border:1px solid rgba(160,125,60,.45);color:#3a2d18}
.csum .gap b{box-shadow:0 1px 3px rgba(0,0,0,.25)}
.csum .gap.dn b{background:#2a72ff;color:#fff}.csum .gap.up b{background:#e5232f;color:#fff}.csum .gap.flat b{background:#7d6b4a;color:#fff}

.sum .hl{font-size:16px;font-weight:700;line-height:1.5}
.gap{margin-top:10px;border-radius:12px;padding:11px 13px;font-size:13.5px;line-height:1.6;background:#16223a;border:1px solid var(--line)}
.gap b{display:inline-block;margin-right:6px;padding:1px 8px;border-radius:6px;font-size:12.5px}
.gap.dn b{background:var(--dn);color:#06121f}.gap.up b{background:var(--up);color:#2a0709}.gap.flat b{background:var(--mut);color:#0b1220}
.card.c1>h2{background:linear-gradient(90deg,#1d4ed8,#3b82f6);color:#fff;border-bottom:0;text-shadow:0 1px 2px rgba(0,0,0,.35)}
#pk-kr>h2{background:linear-gradient(90deg,#047857,#10b981);color:#fff;border-bottom:0;text-shadow:0 1px 2px rgba(0,0,0,.35)}
#pk-us>h2{background:linear-gradient(90deg,#6d28d9,#a78bfa);color:#fff;border-bottom:0;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.card.c4>h2{background:linear-gradient(90deg,#b45309,#f59e0b);color:#fff;border-bottom:0;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.card.c1>h2 i,#pk-kr>h2 i,#pk-us>h2 i,.card.c4>h2 i{background:#fff !important;color:#0b1220 !important;text-shadow:none}
.card.c1>h2 small,#pk-kr>h2 small,#pk-us>h2 small,.card.c4>h2 small{color:rgba(255,255,255,.85)}
.card>h2{font-size:16px;padding:13px 14px}
.mg{border-top:1px solid rgba(255,255,255,.05)}.mg:first-of-type{border-top:0}
.mg0{background:linear-gradient(180deg,rgba(110,140,205,.16),rgba(110,140,205,.02))}.mg0 .sec{color:#9db3e6}
.mg1{background:linear-gradient(180deg,rgba(206,176,118,.15),rgba(206,176,118,.02))}.mg1 .sec{color:#d9c08f}
#pk-kr{background:linear-gradient(180deg,rgba(64,160,130,.17),rgba(64,160,130,.02) 70%),var(--card);border-color:rgba(64,160,130,.28)}#pk-kr h2{border-bottom-color:rgba(64,160,130,.25)}#pk-kr h2 i{background:#5cc4a4}
#pk-us{background:linear-gradient(180deg,rgba(150,125,210,.18),rgba(150,125,210,.02) 70%),var(--card);border-color:rgba(150,125,210,.3)}#pk-us h2{border-bottom-color:rgba(150,125,210,.27)}#pk-us h2 i{background:#b6a0ef}
.mg .tile,#pk-kr .tile,#pk-us .tile{background:rgba(7,12,25,.55);border:1px solid rgba(255,255,255,.05)}
.sec{padding:10px 14px 0;font-size:12px;color:var(--mut);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:8px 12px 12px}
.tile{background:var(--tile);border-radius:11px;padding:8px 7px;min-width:0}
.tile .lb{font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .val{font-size:15px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.tile .chg{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:1px}
.tile .tm{font-size:9.5px;color:var(--mut);margin-top:2px;line-height:1.3}
.up{color:var(--up)}.dn{color:var(--dn)}.flat{color:var(--mut)}
.list{max-height:60vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.nm{flex:1;min-width:0}
.nm b{display:block;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm span{font-size:11.5px;color:var(--mut)}
.px{text-align:right;font-variant-numeric:tabular-nums}
.px b{display:block;font-size:16px}
.px span{font-size:12.5px;font-weight:600}
.memo{max-height:70vh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px;font-size:14px;line-height:1.7;word-break:keep-all}
.memo h3{margin:14px 0 6px;font-size:13px;color:var(--acc)}
.memo h3:first-child{margin-top:0}
.fact{display:flex;gap:10px;margin-bottom:10px}
.fact i{flex:none;width:22px;height:22px;border-radius:50%;background:var(--acc);color:#06231d;font-style:normal;font-weight:800;font-size:12px;display:grid;place-items:center;margin-top:2px}
.fact p{margin:0}.fact b{display:block}
.pick{background:var(--tile);border-radius:10px;padding:9px 11px;margin-bottom:8px}
.pick b{display:block;margin-bottom:2px}
.src{font-size:12px;color:var(--mut);line-height:1.8}
.src a{text-decoration:underline}
.note{font-size:11.5px;color:var(--mut);text-align:center;line-height:1.6;padding:6px 10px}
.empty{color:var(--mut)}
.rb{margin-left:auto;flex:none;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:12px;height:46px;width:52px;padding:0;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1.1;cursor:pointer}
.rb:active{background:#1a2640}.rb[disabled]{opacity:.6}
.rb .ic{display:inline-block;font-size:18px}
.spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.stat{max-width:520px;margin:0 auto;padding:8px 14px;font-size:12px;line-height:1.5;color:var(--mut);display:none}
.stat.err{color:#ffb4a8}.stat.busy{color:var(--acc)}
.nfm{position:fixed;inset:0;z-index:50;background:rgba(5,9,18,.72);display:none;align-items:center;justify-content:center;padding:18px}
.nfm.on{display:flex}
.nfb{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 16px 12px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.nfb h3{margin:0 0 6px;font-size:16px}
.nfb p{margin:0 0 12px;font-size:13px;line-height:1.6;color:var(--mut)}
.nfr{display:flex;gap:8px;align-items:stretch;margin-bottom:6px}
.nfr input{flex:1;font-size:22px;font-weight:700;text-align:center;border-radius:12px;border:1px solid var(--line);background:var(--tile);color:var(--tx);padding:10px 8px;font-variant-numeric:tabular-nums;width:100%}
.nfs{width:48px;border-radius:12px;border:1px solid var(--line);background:var(--tile);color:var(--tx);font-size:22px;font-weight:800;cursor:pointer;padding:0}
.nfs.on.p{background:var(--up);color:#2a0709;border-color:var(--up)}
.nfs.on.m{background:var(--dn);color:#06121f;border-color:var(--dn)}
.nfe{min-height:18px;font-size:12px;color:#ffb4a8;margin:2px 2px 8px}
.nfa{display:flex;gap:8px}
.nfa button{flex:1;height:46px;border-radius:12px;font-size:14.5px;font-weight:700;border:1px solid var(--line);cursor:pointer;color:var(--tx);background:var(--tile)}
.nfa .ok{background:var(--acc);color:#06231d;border-color:var(--acc)}
.nfx{display:none;width:100%;margin-top:6px;background:none;border:0;color:var(--mut);font-size:12px;text-decoration:underline;cursor:pointer;padding:6px}
.nfchip{margin-top:10px;border:1px dashed var(--line);background:none;color:var(--acc);border-radius:10px;font-size:12.5px;font-weight:600;padding:7px 12px;cursor:pointer}
.wrap{padding-bottom:96px}
.safab{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:40;height:46px;padding:0 16px;border-radius:23px;border:0;background:var(--acc);color:#06231d;font-size:14px;font-weight:800;box-shadow:0 6px 20px rgba(0,0,0,.45);cursor:pointer}
.sam{position:fixed;inset:0;z-index:60;background:rgba(5,9,18,.8);display:none;align-items:flex-end;justify-content:center}
.sam.on{display:flex}
.sab{width:100%;max-width:520px;max-height:92vh;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:14px 12px calc(12px + env(safe-area-inset-bottom))}
.sah{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sah h3{margin:0;font-size:16px}
.sax{width:auto;height:34px;padding:0 12px !important;white-space:nowrap;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:13px;font-weight:700;cursor:pointer;padding:0}
.ar.u{color:#ff2330;text-shadow:0 0 8px rgba(255,35,48,.55)}.ar.d{color:#2a72ff;text-shadow:0 0 8px rgba(42,114,255,.55)}.ar.off{opacity:.2;text-shadow:none}
.svh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.sas h4.svt{margin:0 0 6px;font-size:20px;font-weight:800;color:var(--acc);white-space:nowrap}
.svb{display:inline-flex;align-items:center;gap:8px;padding:6px 16px 6px 12px;border-radius:14px;color:#fff;font-weight:900}
.svb .svi{font-size:30px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}.svb b{font-size:22px;letter-spacing:-.5px}
.svb.l1{background:linear-gradient(135deg,#0a3ed8,#1e5bff);box-shadow:0 0 18px rgba(30,91,255,.6)}
.svb.l2{background:linear-gradient(135deg,#2a72ff,#5b9bff);box-shadow:0 0 14px rgba(42,114,255,.45)}
.svb.l3{background:linear-gradient(135deg,#6b7893,#8b98b3);color:#0b1220}
.svb.l4{background:linear-gradient(135deg,#ff3340,#ff6a72);box-shadow:0 0 14px rgba(255,51,64,.5)}
.svb.l5{background:linear-gradient(135deg,#e5001a,#ff2a38);box-shadow:0 0 22px rgba(255,35,48,.7)}
.svi2{font-size:30px;vertical-align:-4px;margin-left:6px;filter:drop-shadow(0 2px 5px rgba(0,0,0,.45))}
.svn{font-size:18px;font-weight:900;margin-left:4px;letter-spacing:-.3px}
.svn.l1{color:#3f7bff}.svn.l2{color:#5b9bff}.svn.l3{color:#aab5cc}.svn.l4{color:#ff4d58}.svn.l5{color:#ff2330;text-shadow:0 0 10px rgba(255,35,48,.55)}
.svg{display:none;grid-template-columns:repeat(5,1fr);gap:4px;margin:2px 0 10px}
.svg div{border-radius:9px;padding:5px 0 4px;text-align:center;opacity:.28;border:1px solid transparent}
.svg div i{display:block;font-style:normal;font-size:16px;line-height:1.2}.svg div span{display:block;font-size:10.5px;font-weight:700;margin-top:1px}
.svg .l1{background:#1e5bff;color:#fff}.svg .l2{background:#4a8bff;color:#fff}.svg .l3{background:#8b98b3;color:#0b1220}.svg .l4{background:#ff4d58;color:#fff}.svg .l5{background:#ff1f2d;color:#fff}
.svg div.on{opacity:1;transform:translateY(-2px) scale(1.06);border-color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.sstar{display:flex;flex-direction:column;gap:2px;margin:0}.sstar div{display:flex;align-items:center;gap:4px;font-size:17px;letter-spacing:1px;justify-content:flex-end}.sstar b{width:auto;font-size:12px;letter-spacing:0;color:var(--mut);margin-right:2px}.sstar em{font-style:normal;font-size:11.5px;letter-spacing:0;color:var(--mut);margin-left:3px}
.sar{display:flex;gap:8px}
.sar input{flex:1;min-width:0;font-size:16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);padding:11px 12px}
.sar button{height:46px;padding:0 18px;border-radius:12px;border:0;background:var(--acc);color:#06231d;font-size:14.5px;font-weight:800;cursor:pointer}
.sar button[disabled]{opacity:.6}
.sacf{margin-top:8px;font-size:12px;color:var(--mut);line-height:1.6}
.sacf.warn{background:#2a1f12;border:1px solid #5a4320;border-radius:12px;padding:10px 12px;color:#e9d3a8}
.sacf a{color:var(--acc);text-decoration:underline;cursor:pointer;margin-left:6px}
.sacr{display:flex;gap:8px;margin:8px 0 4px}
.sacr input{flex:1;min-width:0;font-size:14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);padding:9px 10px}
.sacr button{height:40px;padding:0 14px;border-radius:10px;border:0;background:var(--acc);color:#06231d;font-weight:800;cursor:pointer}
.sao{margin-top:10px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1}
.sas{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:10px;font-size:13.5px;line-height:1.65}
.sas h4{margin:0 0 8px;font-size:13px;color:var(--acc)}
.sas.sae{color:#ffb4a8}
.sat{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sat b{font-size:18px}.sat span{font-size:12px;color:var(--mut)}
.spx{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:4px}
.spx small{font-size:13px;font-weight:700;margin-left:6px}
.skv{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.skv div{display:flex;justify-content:space-between;gap:6px;font-size:13px;border-bottom:1px solid var(--line);padding:3px 0}
.skv span{color:var(--mut);white-space:nowrap}.skv b{text-align:right;font-variant-numeric:tabular-nums;word-break:keep-all}
.sig{display:flex;gap:8px;margin-bottom:8px}
.sig i{flex:none;font-style:normal;width:22px;text-align:center}
.sig p{margin:0}.sig b{display:block}
.svd{display:inline-block;padding:2px 10px;border-radius:8px;font-size:12.5px;font-weight:800;margin-left:6px}
.svd.g{background:var(--up);color:#2a0709}.svd.w{background:var(--dn);color:#06121f}.svd.n{background:var(--mut);color:#0b1220}
.sdl table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.sdl th,.sdl td{padding:4px 2px;text-align:right;border-bottom:1px solid var(--line)}.sdl th:first-child,.sdl td:first-child{text-align:left}
.sdl th{color:var(--mut);font-weight:600}
.snw a{display:block;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.5}
.snw a:last-child{border-bottom:0}.snw span{display:block;font-size:11px;color:var(--mut)}
.schip{display:inline-block;margin:0 6px 6px 0;padding:7px 12px;border-radius:10px;border:1px solid var(--line);background:var(--tile);color:var(--tx);font-size:13px;cursor:pointer}

.rb{width:46px}.hd{gap:8px}.ttl b{font-size:16px;overflow:hidden;text-overflow:ellipsis}
.sec.secr{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:6px}
.nfchip.sm{margin:0;padding:5px 10px;font-size:12px;flex:none;white-space:nowrap}

.pkm{position:fixed;inset:0;z-index:80;background:rgba(5,9,18,.82);display:none;align-items:flex-end;justify-content:center}
.pkm.on{display:flex}
.pkb{width:100%;max-width:520px;height:88vh;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:14px 12px calc(10px + env(safe-area-inset-bottom))}
.pkb .sah{flex:none}
.pkb .pkq{flex:none;width:100%;font-size:16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);padding:11px 12px}
.pkfl{flex:none;display:flex;gap:6px;margin:8px 0 6px;overflow-x:auto}
.pkfl button{flex:none;height:32px;padding:0 13px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--mut);font-size:13px;font-weight:700;cursor:pointer}
.pkfl button.on{background:var(--acc);color:#06231d;border-color:var(--acc)}
.pkst{flex:none;font-size:11.5px;color:var(--mut);margin:0 2px 6px}
.pkl{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.pkr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 13px;border-bottom:1px solid var(--line);cursor:pointer}
.pkr:active{background:var(--tile)}
.pkr b{font-size:14.5px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pkr span{flex:none;font-size:11.5px;color:var(--mut)}
.pkr.dir b{color:var(--acc)}
.pke .pks{flex:1;min-width:0;text-align:left;font-size:15px;border-radius:10px;border:1px solid var(--line);background:var(--tile);color:var(--tx);padding:10px 11px;height:42px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pke .pks.empty{color:var(--mut)}
.pke .pkx{flex:none;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--mut);font-size:14px;cursor:pointer;padding:0}
.sarl{margin-top:8px}.sarl button{width:100%;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:13.5px;font-weight:700;cursor:pointer}
.pke{padding:10px 12px 12px}
.pke .pkh{font-size:12px;color:var(--mut);line-height:1.5;margin:0 2px 8px}
.pke .pkn{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.pke .pkn i{flex:none;width:22px;height:22px;border-radius:50%;background:var(--tile);color:var(--mut);font-style:normal;font-size:12px;font-weight:700;display:grid;place-items:center}
.pke input{flex:1;font-size:15px;border-radius:10px;border:1px solid var(--line);background:var(--tile);color:var(--tx);padding:10px 11px;width:100%}
.pke .pka{display:flex;gap:8px;margin-top:10px}
.pke .pka button,.pkf button{height:42px;border-radius:11px;border:1px solid var(--line);background:var(--tile);color:var(--tx);font-size:14px;font-weight:700;cursor:pointer;padding:0 14px}
.pke .pka .ok{flex:1;background:var(--acc);color:#06231d;border-color:var(--acc)}
.pkf{padding:8px 12px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pkf button{flex:none}
.pkf span{font-size:11.5px;color:var(--mut);line-height:1.5;flex:1;min-width:140px}

<body>
<header><div class="hd"><div class="logo" id="logo">허</div><div class="ttl"><b id="ttl">깨비주식 아침브리핑</b><span id="sub">—</span></div><button class="rb" id="refBtn" type="button"><span class="ic" id="refIc">⚡</span><span class="lb2">실시간</span></button><button class="rb" id="unBtn" type="button" aria-label="사용자 이름 입력"><span class="ic">👤</span><span class="lb2">사용자</span></button></div><div class="stat" id="stat"></div></header>
<div class="wrap" id="app"></div>
<div class="nfm" id="nfm" role="dialog" aria-modal="true" aria-labelledby="nfT">
  <div class="nfb">
    <h3 id="nfT">야간선물 마감값을 찾지 못했어요</h3>
    <p>코스피200 야간선물 마감 등락률(%)을 입력하면 갭 방향을 바로 계산합니다.</p>
    <div class="nfr">
      <button class="nfs p" id="nfP" type="button" aria-label="플러스">+</button>
      <button class="nfs m" id="nfM" type="button" aria-label="마이너스">−</button>
      <input id="nfI" type="text" inputmode="decimal" autocomplete="off" placeholder="예: 1.2" aria-label="야간선물 등락률 퍼센트">
    </div>
    <div class="nfe" id="nfE"></div>
    <div class="nfa"><button class="ok" id="nfOk" type="button">적용</button><button id="nfSkip" type="button">무시하고 시작하기</button></div>
    <button class="nfx" id="nfClr" type="button">수동입력값 지우기</button>
  </div>
</div>
<div class="nfm" id="unm" role="dialog" aria-modal="true" aria-labelledby="unT">
  <div class="nfb">
    <h3 id="unT">사용자 이름</h3>
    <p>한글 3자를 입력하세요. 첫 글자는 큰 원형 로고에, 뒤 두 글자는 제목(“○○주식 보좌관”)에 쓰입니다.<br>예: 허승호 → 로고 “허”, 제목 “승호주식 보좌관”</p>
    <input class="unin" id="unI" type="text" maxlength="3" autocomplete="off" placeholder="허승호" aria-label="사용자 이름 한글 3자">
    <div class="unmsg" id="unE"></div>
    <div class="nfa"><button class="ok" id="unOk" type="button">적용</button><button id="unCx" type="button">닫기</button></div>
    <button class="nfx" id="unClr" type="button">이름 지우기 (기본 제목으로)</button>
  </div>
</div>
<div class="pkm" id="pkm" role="dialog" aria-modal="true" aria-labelledby="pkT">
  <div class="pkb">
    <div class="sah"><h3 id="pkT">국내 종목 선택</h3><button class="sax" id="pkX" type="button">창닫기</button></div>
    <input class="pkq" id="pkQ" type="text" placeholder="종목명·코드·초성 검색 (예: 삼성, ㅅㅅ, 005930)" autocomplete="off" autocapitalize="off" enterkeyhint="search">
    <div class="pkfl" id="pkF"></div>
    <div class="pkst" id="pkS"></div>
    <div class="pkl" id="pkL"></div>
  </div>
</div>
<button class="safab" id="saFab" type="button">📊 종목분석</button>
<div class="sam" id="sam" role="dialog" aria-modal="true" aria-labelledby="saT">
  <div class="sab">
    <div class="sah"><h3 id="saT">📊 종목분석</h3><button class="sax" id="saX" type="button" aria-label="닫기">창닫기</button></div>
    <div class="sar"><input id="saI" type="text" placeholder="종목명 또는 6자리 코드 (예: 삼성전자)" autocomplete="off" enterkeyhint="search" aria-label="종목명 또는 종목코드"><button id="saGo" type="button">분석</button></div>
    <div class="sarl" style="display:flex;gap:8px"><button id="saPick" type="button">📋 국내 종목 고르기</button><button id="saPickUs" type="button">📋 미국 종목 고르기</button></div>
    <div id="saCfg"></div>
    <div class="sao" id="saO"></div>
  </div>
</div>
<script>
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function sign(p){var s=String(p||'').trim();if(!s)return 'flat';if(/^[-−▼]/.test(s))return 'dn';if(/^[+▲]?0([.,]0+)?%?$/.test(s))return 'flat';return 'up'}
function arrow(c){return c==='up'?'▲':c==='dn'?'▼':''}
function bare(s){return String(s||'').replace(/^[+\-−▲▼\s]+/,'').replace('%','')}
function pct(p){var c=sign(p);return String(p||'').trim()?arrow(c)+bare(p)+'%':'—'}
function dif(d,c){var s=String(d||'').trim();return s?arrow(c)+bare(s):''}
function nl(n){return '<a href="https://search.naver.com/search.naver?query='+encodeURIComponent(n)+'" target="_blank" rel="noopener">'+esc(n)+'</a>'}
function stocks(arr,vol){
  if(!arr||!arr.length)return '<div class="memo empty">데이터 없음</div>';
  return arr.map(function(it){
    var c=sign(it.p);
    var sub=esc(it.s||'')+(vol&&it.x?' · 거래량 '+esc(it.x):'');
    return '<div class="row"><div class="nm"><b>'+nl(it.n)+'</b><span>'+sub+'</span></div><div class="px"><b class="'+c+'">'+esc(it.v)+'</b><span class="'+c+'">'+pct(it.p)+' '+dif(it.d,c)+'</span></div></div>';
  }).join('');
}
function render(B){
  document.title=titleText();
  document.getElementById('sub').textContent=(B.date||'')+' · '+(B.asof||'');
  var h='';
  var g=B.gap||{};
  h+='<div class="card csum"><div class="sum"><div class="hl">'+esc(B.headline||'')+'</div>'
    +(g.dir?'<div class="gap '+esc(g.tone||'flat')+'"><b>'+esc(g.dir)+'</b>'+esc(g.why||'')+'</div>':'')
    +'</div></div>';
  h+='<div class="card c1"><h2><i>1</i>시장지표</h2>';
  (B.market||[]).forEach(function(grp,gi){
    h+='<div class="mg mg'+(gi%2)+'"><div class="sec'+(grp.nf&&B.nfBtn?' secr':'')+'"><span>'+esc(grp.g)+'</span>'+(grp.nf&&B.nfBtn?'<button class="nfchip sm" id="nfOpen" type="button">'+esc(B.nfBtn)+'</button>':'')+'</div>';
    h+='<div class="grid">';
    (grp.items||[]).forEach(function(it){
      var c0=sign(it.p),c=grp.inv?(c0==='up'?'dn':c0==='dn'?'up':c0):c0,hv=String(it.v||'').trim(),has=hv||String(it.p||'').trim();
      h+='<div class="tile"><div class="lb">'+nl(it.n)+'</div><div class="val '+(has?c:'flat')+'">'+(hv?esc(it.v):'—')+'</div><div class="chg '+c+'">'+(has?pct(it.p):'미확인')+'</div>'+(it.t?'<div class="tm">'+esc(it.t)+'</div>':'')+'</div>';
    });
    h+='</div></div>';
  });
  h+='</div>';
  h+=pkCard('kr',B)+pkCard('us',B);
  h+='<div class="card c4"><h2><i>4</i>오늘의 시황 브리핑</h2><div class="memo">';
  h+='<h3>핵심 3가지</h3>';
  (B.facts||[]).slice(0,3).forEach(function(f,i){h+='<div class="fact"><i>'+(i+1)+'</i><p><b>'+esc(f.h)+'</b>'+esc(f.b)+'</p></div>'});
  h+='<h3>반도체 · 미국↔국내 연동</h3><p style="margin:0">'+esc(B.semi||'')+'</p>';
  h+='<h3>종가매수 → 익일시가매도 후보</h3>';
  if(B.picks&&B.picks.length){B.picks.slice(0,3).forEach(function(p){h+='<div class="pick"><b>'+nl(p.n)+'</b>'+esc(p.why)+'</div>'})}
  else h+='<p class="empty" style="margin:0">후보 보류 — 근거가 뚜렷한 종목이 없습니다.</p>';
  h+='<h3>출처</h3><div class="src">';
  (B.sources||[]).forEach(function(s){if(/^https?:\/\//.test(s.u||''))h+='· <a href="'+esc(s.u)+'" target="_blank" rel="noopener">'+esc(s.t||s.u)+'</a><br>'});
  h+='</div></div></div>';
  h+='<div class="note">상승 = 빨강 ▲ · 하락 = 파랑 ▼ · 종목명을 누르면 네이버에서 열립니다.<br>참고용 정보이며 투자 판단의 근거 자료가 아닙니다. 투자 책임은 본인에게 있습니다.</div>';
  document.getElementById('app').innerHTML=h;
}
/* ---------- 시세: GitHub Actions가 5분마다 저장한 quotes.json을 읽음 ---------- */
var QURL='https://raw.githubusercontent.com/cocok6666-ai/stock/data/quotes.json';
var STRUCT={
 market:[
  {g:'지수 · 선물',nf:1,items:[['코스피','KOSPI'],['코스닥','KOSDAQ'],['코스피200 야간선물','K200NF'],['다우존스','DJI'],['나스닥','IXIC'],['S&P500','SPX']]},
  {g:'유가 · 금 · 환율 · 금리',inv:1,items:[['WTI','WTI'],['브렌트유','BRENT'],['두바이유','DUBAI'],['국제 금','GOLD'],['원/달러','USDKRW'],['미국 10년물','US10Y']]}
 ],
 kr:[['KODEX 200','ETF','069500'],['KODEX AI반도체TOP2플러스','ETF','395160'],['삼성전자','반도체','005930'],['SK하이닉스','반도체','000660']],
 us:[['엔비디아','NVDA'],['SK하이닉스(ADR)','SKHY'],['마이크론 테크놀로지','MU'],['샌디스크','SNDK'],['브로드컴','AVGO'],['에이엠디','AMD'],['미국 반도체 3배 ETF','SOXL']]
};
var BR=null,Q=null,busy=false;
function hhmm(){return new Date().toLocaleTimeString('ko-KR',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit',hour12:false})}
function q(k){return (Q&&Q.items&&Q.items[k])||{}}
function build(){
  var B={date:BR.date,asof:BR.asof,headline:BR.headline,gap:BR.gap,facts:BR.facts,semi:BR.semi,picks:BR.picks,sources:BR.sources};
  B.market=STRUCT.market.map(function(g){return {g:g.g,nf:g.nf,inv:g.inv,items:g.items.map(function(a){var x=q(a[1]);return {n:a[0],v:x.v||'',p:x.p||'',t:x.t||''}})}});
  B.kr=STRUCT.kr.map(function(a){var x=q(a[2]);return {n:a[0],s:(x.t?a[1]+' · '+x.t:a[1]),v:x.v||'—',p:x.p||'',d:x.d||'',x:x.x||''}});
  B.us=STRUCT.us.map(function(a){var x=q(a[1]);return {n:a[0],s:a[1]+(x.t?' · '+x.t:''),v:x.v||'—',p:x.p||'',d:x.d||''}});
  B.krAsof=Q&&Q.updated?'시세 '+Q.updated.slice(11,19)+' 갱신':'시세 없음';
  B.usAsof=B.krAsof;
  /* 야간선물: night.json(자동) 또는 팝업 수동입력 → 시장현황 칸과 갭 카드에 반영 */
  var nf=nfData();
  B.gap=nfGap(BR.gap,nf);
  B.nfBtn=nf?(nf.src==='수동입력'?'✎ 수동입력 수정':''):'＋ 야간선물 등락률 입력';
  if(nf)B.market.forEach(function(g){g.items.forEach(function(it){if(it.n==='코스피200 야간선물'){it.v=nf.close||'';it.p=nf.pct;it.t=(nf.src==='수동입력'?'수동입력':'마감 · '+nf.src)}})});
  return B;
}
/* ---------- 야간선물 마감값: night.json(자동수집) / 수동입력 팝업 ---------- */
var NIGHT=null,nfShown=false,nfSign='';
function kst(){var s=new Date().toLocaleString('sv-SE',{timeZone:'Asia/Seoul'});return {d:s.slice(0,10),hm:s.slice(11,16)}}
/* 가장 최근에 끝난 야간 세션의 종료일(KST). 세션은 화~토 06:00에 끝남 (월요일 아침 → 토요일) */
function nfExpected(){
  var k=kst(),a=k.d.split('-'),t=Date.UTC(+a[0],+a[1]-1,+a[2]);
  if(k.hm<'06:00')t-=864e5;
  for(var i=0;i<7;i++){var w=new Date(t).getUTCDay();if(w>=2&&w<=6)break;t-=864e5}
  return new Date(t).toISOString().slice(0,10);
}
function fmtPct(x){return (x>0?'+':x<0?'-':'')+Math.abs(x).toFixed(2)}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){}}
function nfAuto(){
  if(NIGHT&&NIGHT.closed===nfExpected()&&/^[+\-−]?\d/.test(String(NIGHT.pct||'').trim()))
    return {pct:String(NIGHT.pct).trim().replace('−','-'),close:NIGHT.close||'',src:NIGHT.src||'자동'};
  return null;
}
function nfManual(){
  try{var m=JSON.parse(lsGet('nf_manual')||'null');if(m&&m.sess===nfExpected()&&isFinite(parseFloat(m.pct)))return {pct:m.pct,close:'',src:'수동입력'}}catch(e){}
  return null;
}
function nfData(){return nfManual()||nfAuto()}
function nfGap(g,nf){
  if(!nf)return g;
  var x=parseFloat(nf.pct);if(!isFinite(x))return g;
  var dir=x>=0.3?'갭상승 예상':x<=-0.3?'갭하락 예상':'보합 출발 예상',tone=x>=0.3?'up':x<=-0.3?'dn':'flat';
  var why='코스피200 야간선물 '+nf.pct+'% ('+nf.src+(nf.close?' · 마감 '+nf.close:'')+')';
  var kv=Q&&Q.items&&Q.items.KOSPI&&parseFloat(String(Q.items.KOSPI.v||'').replace(/,/g,''));
  if(kv&&kst().hm<'09:00')why+=' → 코스피 예상 시초 약 '+Math.round(kv*(1+x/100)).toLocaleString('ko-KR')+' (전일 종가 '+Q.items.KOSPI.v+' 기준)';
  why+='. 야간선물 기준 단순 추정이며 실제 시초는 달라질 수 있습니다.';
  var extra=g&&g.why&&!/확인하지 못|미확인/.test(g.why)?' '+g.why:'';
  return {dir:dir,tone:tone,why:why+extra};
}
async function loadNight(){
  try{var r=await fetch('night.json?_='+Date.now(),{cache:'no-store'});NIGHT=r.ok?await r.json():null}catch(e){NIGHT=null}
}
function nfEl(i){return document.getElementById(i)}
function nfSetSign(s){nfSign=s;nfEl('nfP').classList.toggle('on',s==='+');nfEl('nfM').classList.toggle('on',s==='-')}
function nfOpen(){
  var m=nfManual();
  nfEl('nfE').textContent='';nfEl('nfI').value='';nfSetSign('');
  if(m){var v=parseFloat(m.pct);nfSetSign(v<0?'-':'+');nfEl('nfI').value=Math.abs(v).toFixed(2)}
  nfEl('nfClr').style.display=m?'block':'none';
  nfEl('nfm').classList.add('on');
  setTimeout(function(){try{nfEl('nfI').focus()}catch(e){}},50);
}
function nfClose(){nfEl('nfm').classList.remove('on')}
function nfApply(){
  var t=nfEl('nfI').value.replace(/[−–]/g,'-').replace(/,/g,'.').replace(/[%\s]/g,''),m=t.match(/^([+-])?(\d+(?:\.\d+)?)$/),e=nfEl('nfE');
  if(!m){e.textContent='숫자만 입력하세요 (예: 1.2 또는 -0.8)';return}
  var s=m[1]||nfSign;
  if(!s){e.textContent='+ 또는 −를 선택하세요';return}
  var v=parseFloat(m[2]);
  if(v>8){e.textContent='±8% 이내 값으로 입력하세요';return}
  lsSet('nf_manual',JSON.stringify({sess:nfExpected(),pct:fmtPct(s==='-'?-v:v)}));
  lsSet('nf_skip',null);
  nfClose();paint();
}
function nfCheck(){
  if(nfData()){nfClose();return}
  if(nfShown||lsGet('nf_skip')===nfExpected())return;
  nfShown=true;nfOpen();
}
(function(){
  nfEl('nfP').addEventListener('click',function(){nfSetSign('+')});
  nfEl('nfM').addEventListener('click',function(){nfSetSign('-')});
  nfEl('nfI').addEventListener('input',function(){var c=this.value.trim().charAt(0);if(c==='+')nfSetSign('+');else if(c==='-'||c==='−')nfSetSign('-');nfEl('nfE').textContent=''});
  nfEl('nfI').addEventListener('keydown',function(ev){if(ev.key==='Enter')nfApply()});
  nfEl('nfOk').addEventListener('click',nfApply);
  nfEl('nfSkip').addEventListener('click',function(){lsSet('nf_skip',nfExpected());nfClose()});
  nfEl('nfClr').addEventListener('click',function(){lsSet('nf_manual',null);nfClose();paint()});
  document.getElementById('app').addEventListener('click',function(ev){if(ev.target.closest&&ev.target.closest('#nfOpen'))nfOpen()});
})();
function setStat(t,c){var e=document.getElementById('stat');e.innerHTML=t;e.className='stat '+(c||'');e.style.display=t?'block':'none'}
function ageMin(){if(!Q||!Q.updated)return null;return (Date.now()-new Date(Q.updated).getTime())/60000}
function paint(force){
  var B=build();if(force||!pkBusy())render(B);
  document.getElementById('sub').textContent=(Q&&Q.updated?Q.updated.slice(5,10).replace('-','/')+' '+Q.updated.slice(11,19)+' 시세 · ':'시세 없음 · ')+(BR.asof||'');
  var a=ageMin();
  if(a==null)setStat('⚠️ 시세 데이터를 아직 받지 못했습니다.','err');
  else if(a>20)setStat('⚠️ 시세가 '+Math.round(a)+'분 전 데이터입니다. 자동 수집이 지연 중일 수 있어요.','err');
  else setStat('','');
  nfCheck();
}
var RAW='https://raw.githubusercontent.com/cocok6666-ai/stock/data/';
async function fetchQ(){
  /* 캐시 우회: 15초 단위로 파일명이 바뀌는 q<번호>.json 을 여러 개 동시에 요청해 가장 최신 것을 사용 */
  var b0=Math.floor((Date.now()/1000-20)/15),ps=[];
  for(var i=0;i<8;i++){(function(n){
    ps.push(fetch(RAW+'q'+n+'.json',{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).catch(function(){return null}));
  })(b0-i)}
  var rs=await Promise.all(ps),best=null;
  rs.forEach(function(x){if(x&&x.updated&&(!best||x.updated>best.updated))best=x});
  var r=await fetch(QURL+'?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).catch(function(){return null});
  if(r&&r.updated&&(!best||r.updated>best.updated))best=r;
  if(!best)throw new Error('시세 파일을 찾지 못했습니다');
  return best;
}
async function loadQ(manual){
  if(busy)return;busy=true;
  var ic=document.getElementById('refIc'),rb=document.getElementById('refBtn'),ok=false,msg='';
  if(manual){ic.className='ic spin';rb.disabled=true;setStat('⏳ 최신 시세 확인 중…','busy')}
  try{var n=await fetchQ();if(!Q||n.updated>=Q.updated)Q=n;ok=true}
  catch(e){msg=e.message||String(e)}
  busy=false;ic.className='ic';rb.disabled=false;
  paint();pkRefresh(manual);
  if(!ok){setStat('⚠️ 시세를 불러오지 못했습니다 ('+esc(msg)+'). 마지막 값을 표시 중입니다.','err')}
  else if(manual&&ageMin()<=20){setStat('✅ '+hhmm()+' 확인 · 시세 기준 '+Q.updated.slice(11,19),'busy');setTimeout(function(){if(ageMin()<=20)setStat('','')},4000)}
}
async function loadBrief(){
  try{var r=await fetch('brief.json?_='+Date.now(),{cache:'no-store'});BR=await r.json()}

async function pkResolve(k,p){
  if(p.code)return;
  var q=p.q.trim();
  if(k==='kr'){
    var loc=KR_LOCAL[pkNorm(q).replace(/\s/g,'')]||KR_LOCAL[q];
    if(loc){p.code=loc;return}
    if(/^[0-9A-Za-z]{6}$/.test(q)&&/\d/.test(q)){p.code=q.toUpperCase();return}
    var r=await saResolve(q);
    if(!r.length)throw new Error('찾지 못함');
    p.code=r[0].code;p.name=r[0].name;return;
  }
  if(/^[A-Za-z][A-Za-z.\-]{0,5}$/.test(q)){
    var t=q.toUpperCase();
    if(Q&&Q.items&&Q.items[t]){p.code=t;return}
    var sfx=['.O','.K',''];
    for(var i=0;i<sfx.length;i++){
      try{var j=await saGet('https://api.stock.naver.com/stock/'+encodeURIComponent(t+sfx[i])+'/basic');
        if(j&&j.closePrice){p.code=t+sfx[i];p.name=j.stockName||'';return}}catch(e){if(e.message==='NOWORKER')throw e}
    }
    throw new Error('찾지 못함');
  }
  var a=await saGet('https://ac.stock.naver.com/ac?q='+encodeURIComponent(q)+'&target=stock');
  var it=((a&&a.items)||[]).filter(function(x){return x&&!Array.isArray(x)&&x.nationCode&&x.nationCode!=='KOR'})[0];
  if(!it)throw new Error('영문 티커로 입력하세요');
  p.code=it.reutersCode||(String(it.code||'')+'.O');p.name=it.name||'';
}
function pkParse(d,vol,nd){
  var num=function(s){if(s==null)return NaN;var v=parseFloat(String(s).replace(/[,+\s]/g,''));return v},
      price=num(d.closePrice),chg=num(d.compareToPreviousClosePrice),ratio=num(d.fluctuationsRatio);
  if(!isFinite(price)||!isFinite(chg))throw new Error('시세 없음');
  var ty=String((d.compareToPreviousPrice||{}).name||'').toUpperCase(),dn=/FALLING|LOWER_LIMIT/.test(ty),up=/RISING|UPPER_LIMIT/.test(ty);
  chg=dn?-Math.abs(chg):up?Math.abs(chg):chg;
  ratio=isFinite(ratio)?(dn?-Math.abs(ratio):up?Math.abs(ratio):ratio):(price!==chg?chg/(price-chg)*100:0);
  var dt=d.localTradedAt?new Date(d.localTradedAt):new Date(),age=(Date.now()-dt.getTime())/1000,st=String(d.marketStatus||'').toUpperCase();
  var live=st==='OPEN'?true:st==='CLOSE'?false:age<1800,s=dt.toLocaleString('sv-SE',{timeZone:'Asia/Seoul'});
  var t=(live&&age<3600)?s.slice(11,16)+' 현재':s.slice(5,7)+'/'+s.slice(8,10)+' '+s.slice(11,16)+' 종가';
  var f=function(x,n){return x.toLocaleString('en-US',{minimumFractionDigits:n,maximumFractionDigits:n})},sg=function(x,n){return (x>0?'+':x<0?'-':'')+f(Math.abs(x),n)};
  var o={v:f(price,nd),p:sg(ratio,2),d:sg(chg,nd),t:t},vv=num(d.accumulatedTradingVolume);
  if(vol&&isFinite(vv)&&vv>0)o.x=f(vv,0);
  return o;
}
async function pkQuote(k,p){
  var key=pkKey(k,p);if(!key)return;
  if(Q&&Q.items&&Q.items[key])return;
  var o;
  if(k==='kr'){
    try{var j=await saGet('https://polling.finance.naver.com/api/realtime/domestic/stock/'+p.code),d=(j.datas||[])[0];if(!d)throw 0;o=pkParse(d,true,0);if(!p.name&&d.stockName)p.name=d.stockName}
    catch(e){if(e&&e.message==='NOWORKER')throw e;var j2=await saGet('https://m.stock.naver.com/api/stock/'+p.code+'/basic');o=pkParse(j2,false,0);if(!p.name&&j2.stockName)p.name=j2.stockName}
  }else{
    var j3=await saGet('https://api.stock.naver.com/stock/'+encodeURIComponent(p.code)+'/basic');o=pkParse(j3,false,2);if(!p.name&&j3.stockName)p.name=j3.stockName;
  }
  CQ[key]=o;
}
async function pkRefresh(force){
  if(pkRun)return;
  if(!force&&Date.now()-pkAt<30000)return;
  if(!PK.kr.length&&!PK.us.length)return;
  pkRun=true;pkAt=Date.now();
  try{
    var jobs=[];
    ['kr','us'].forEach(function(k){PK[k].forEach(function(p){
      jobs.push((async function(){
        try{await pkResolve(k,p);await pkQuote(k,p);delete p.err}
        catch(e){p.err=(e&&e.message==='NOWORKER')?'':(e&&e.message)||'조회 실패'}
      })());
    })});
    await Promise.all(jobs);
    pkStore();
  }finally{pkRun=false}
  if(BR&&!pkBusy())paint();
}

function saN(s){if(s==null)return NaN;var m=String(s).replace(/[,\s%+]/g,'').replace('−','-').match(/-?\d+(?:\.\d+)?/);return m?parseFloat(m[0]):NaN}

function saD(s){s=String(s||'').replace(/\D/g,'');if(s.length>=12)return s.slice(4,6)+'/'+s.slice(6,8)+' '+s.slice(8,10)+':'+s.slice(10,12);if(s.length>=8)return s.slice(4,6)+'/'+s.slice(6,8);return ''}

function saInfo(I,codes,re){var a=(I&&I.totalInfos)||[];for(var i=0;i<a.length;i++){var x=a[i]||{};if(codes.indexOf(x.code)>-1||(re&&re.test(String(x.key||''))))return x.value}return ''}

}
function saCfgRender(msg,edit){
  var w=saWorker(),el=saEl('saCfg');
  if(w&&!edit){el.innerHTML='<div class="sacf">🔗 분석 서버 연결됨<a id="saChg">주소 변경</a></div>';return}
  el.innerHTML='<div class="sacf warn"><b>분석 서버 설정 (처음 한 번)</b><div class="sacr"><input id="saW" type="url" inputmode="url" autocomplete="off" placeholder="https://xxxx.workers.dev" value="'+esc(w)+'"><button id="saWs" type="button">저장</button></div>'
    +'<span id="saWm">'+(msg?esc(msg):'Cloudflare Worker 주소를 붙여넣으세요. 만드는 방법은 저장소 README의 “종목분석 서버”를 보세요.')+'</span></div>';
}
async function saSave(){
  var v=saEl('saW').value.trim().replace(/\/+$/,''),m=saEl('saWm');
  if(!/^https:\/\/[^\s/]+(\/[^\s]*)?$/.test(v)){m.textContent='https:// 로 시작하는 Worker 주소를 입력하세요.';return}
  lsSet('sa_worker',v);m.textContent='연결 확인 중…';
  try{var r=await fetch(v+'/',{cache:'no-store'}),t=await r.text();
    if(r.ok&&/naver-proxy/.test(t)){saCfgRender();return}
    saCfgRender('저장했지만 연결 확인에 실패했습니다 (HTTP '+r.status+'). 주소가 맞는지 확인하세요.',true);
  }catch(e){saCfgRender('저장했지만 서버에 연결하지 못했습니다. 주소를 확인하세요.',true)}
}
function saOpen(){
  saEl('sam').classList.add('on');saCfgRender();
  var l=lsGet('sa_last');if(l&&!saEl('saI').value)saEl('saI').value=l;
  setTimeout(function(){try{saEl('saI').focus()}catch(e){}},50);
}
function saClose(){saEl('sam').classList.remove('on')}
(function(){
  saEl('saFab').addEventListener('click',saOpen);
  saEl('saX').addEventListener('click',saClose);
  saEl('saGo').addEventListener('click',saGo);
  saEl('saI').addEventListener('keydown',function(ev){if(ev.key==='Enter')saGo()});
  saEl('saCfg').addEventListener('click',function(ev){var t=ev.target;if(!t||!t.closest)return;
    if(t.closest('#saWs'))saSave();else if(t.closest('#saChg'))saCfgRender('',true)});
  saEl('saO').addEventListener('click',function(ev){var b=ev.target&&ev.target.closest&&ev.target.closest('[data-sa-code]');
    if(b){var my=++saTok;saRun(b.getAttribute('data-sa-code'),b.getAttribute('data-sa-name'),my)}});
  document.addEventListener('keydown',function(ev){if(ev.key==='Escape')saClose()});
})();

/* ---------- 종목 목록 선택 팝업 (국내/미국 · 검색 · 초성 · 스크롤) ---------- */
var SLM={kr:null,us:null},SLP={kr:null,us:null},PKC=null,PKR=[],PKN=0,PKF='all',PKMODE='kr';
var CHO='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
function slCho(t){var o='';for(var i=0;i<t.length;i++){var c=t.charCodeAt(i);o+=(c>=0xAC00&&c<=0xD7A3)?CHO.charAt(Math.floor((c-0xAC00)/588)):t.charAt(i).toLowerCase()}return o}
function slNorm(t){return String(t||'').replace(/\s+/g,'').toLowerCase()}
function slLoad(m){
  if(SLP[m])return SLP[m];
  var f=m==='kr'?'stocks.json':'stocks_us.json';
  SLP[m]=fetch(f+'?_='+Math.floor(Date.now()/600000),{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){
    var a=(j&&j[m])||[];if(a.length<100)throw 0;
    SLM[m]=a.map(function(x){
      if(m==='kr'){var n=slNorm(x[1]);return {code:x[0],name:x[1],mk:x[2],n:n,c:String(x[0]).toLowerCase(),h:slCho(n),e:''}}
      var ko=US_KO[x[1]]||x[2],n2=slNorm(ko+x[2]);return {code:x[0],sym:x[1],name:ko,mk:x[4],n:n2,c:String(x[1]).toLowerCase(),h:slCho(slNorm(ko)),e:slNorm(x[3]),en:x[3]};
    });
  }).catch(function(){
    SLP[m]=null;
    if(m==='kr')SLM.kr=[['005930','삼성전자','P'],['000660','SK하이닉스','P'],['069500','KODEX 200','E'],['395160','KODEX AI반도체TOP2플러스','E']].map(function(x){var n=slNorm(x[1]);return {code:x[0],name:x[1],mk:x[2],n:n,c:x[0],h:slCho(n),e:''}});
    else SLM.us=Object.keys(US_KO).map(function(t){var n=slNorm(US_KO[t]);return {sym:t,name:US_KO[t],mk:'',n:n,c:t.toLowerCase(),h:slCho(n),e:'',en:''}});
    SLM[m].fb=true;
  });
  return SLP[m];
}
var MKN={P:'코스피',D:'코스닥',E:'ETF',N:'나스닥',Y:'뉴욕',A:'아멕스'};
function PKQ_val(){return document.getElementById('pkQ').value}
function pkFilter(){
  var q=slNorm(PKQ_val()),cho=/^[ㄱ-ㅎ]+$/.test(q),out=[],r2=[],L=SLM[PKMODE]||[];
  for(var i=0;i<L.length;i++){
    var x=L[i];if(PKF!=='all'&&x.mk!==PKF)continue;
    if(!q){out.push(x);continue}
    if(cho){var p=x.h.indexOf(q);if(p===0)out.push(x);else if(p>0)r2.push(x);continue}
    if(x.n.indexOf(q)===0||x.c.indexOf(q)===0||(x.e&&x.e.indexOf(q)===0))out.push(x);
    else if(x.n.indexOf(q)>0||x.c.indexOf(q)>0||(x.e&&x.e.indexOf(q)>0))r2.push(x);
  }
  return out.concat(r2);
}
function pkMore(){
  var el=document.getElementById('pkL'),end=Math.min(PKR.length,PKN+60),h='',us=PKMODE==='us';
  for(var i=PKN;i<end;i++){var x=PKR[i];
    h+='<div class="pkr" data-i="'+i+'"><b>'+esc(x.name)+'</b><span>'+esc(us?(x.sym+(x.en?' · '+x.en.slice(0,18):'')):(x.code+' · '+(MKN[x.mk]||'')))+'</span></div>'}
  PKN=end;el.insertAdjacentHTML('beforeend',h);
}
function pkShow(){
  var el=document.getElementById('pkL'),q=PKQ_val().trim(),L=SLM[PKMODE]||[],us=PKMODE==='us';
  PKR=pkFilter();PKN=0;el.innerHTML='';el.scrollTop=0;
  if(!PKR.length){
    var dq=us?/^[A-Za-z][A-Za-z.\-]{0,5}$/.test(q):/^\d{6}$/.test(q);
    el.innerHTML='<div class="pkr" style="cursor:default"><b style="color:var(--mut)">검색 결과가 없습니다</b></div>'+(dq?'<div class="pkr dir" data-direct="'+esc(us?q.toUpperCase():q)+'"><b>'+esc(us?q.toUpperCase():q)+' 그대로 사용</b><span>직접</span></div>':'');
  }else pkMore();
  document.getElementById('pkS').textContent=(L.fb?'목록을 불러오지 못했습니다. '+(us?'티커를':'6자리 코드를')+' 입력해 선택하세요. ':'')+(q?PKR.length.toLocaleString('ko-KR')+'개 검색됨':'전체 '+PKR.length.toLocaleString('ko-KR')+'개 · '+(us?'거래소별 시가총액 순':'시가총액 순'))+(PKR.length>PKN?' · 아래로 스크롤':'');
}
function pkPick(mode,cb){
  PKC=cb;PKF='all';PKMODE=mode;
  document.getElementById('pkm').classList.add('on');
  document.getElementById('pkT').textContent=mode==='us'?'미국 종목 선택':'국내 종목 선택';
  var qi=document.getElementById('pkQ');qi.value='';
  qi.placeholder=mode==='us'?'한글명·티커·영문명 검색 (예: 엔비디아, NVDA, ㅇㅂㄷㅇ)':'종목명·코드·초성 검색 (예: 삼성, ㅅㅅ, 005930)';
  var fl=mode==='us'?[['all','전체'],['N','나스닥'],['Y','뉴욕'],['A','아멕스']]:[['all','전체'],['P','코스피'],['D','코스닥'],['E','ETF']];
  document.getElementById('pkF').innerHTML=fl.map(function(a){return '<button type="button" data-f="'+a[0]+'" class="'+(a[0]==='all'?'on':'')+'">'+a[1]+'</button>'}).join('');
  document.getElementById('pkL').innerHTML='<div class="pkr" style="cursor:default"><b style="color:var(--mut)">목록 불러오는 중…</b></div>';
  slLoad(mode).then(function(){if(PKMODE===mode&&PKC)pkShow()});
  setTimeout(function(){try{qi.focus()}catch(e){}},80);
}
function pkClose(){document.getElementById('pkm').classList.remove('on');PKC=null}
(function(){
  var q=document.getElementById('pkQ'),l=document.getElementById('pkL');
  var tm;q.addEventListener('input',function(){clearTimeout(tm);tm=setTimeout(pkShow,120)});
  l.addEventListener('scroll',function(){if(l.scrollTop+l.clientHeight>l.scrollHeight-200&&PKN<PKR.length)pkMore()});
  l.addEventListener('click',function(ev){
    var r=ev.target&&ev.target.closest&&ev.target.closest('.pkr');if(!r)return;
    var cb=PKC,it=null;
    if(r.getAttribute('data-direct')){var c=r.getAttribute('data-direct');it=PKMODE==='us'?{code:'',sym:c,name:c}:{code:c,name:c}}
    else if(r.hasAttribute('data-i'))it=PKR[+r.getAttribute('data-i')];
    if(!it||!cb)return;pkClose();cb(it);
  });
  document.getElementById('pkF').addEventListener('click',function(ev){var b=ev.target&&ev.target.closest&&ev.target.closest('button');if(!b)return;PKF=b.getAttribute('data-f');
    var bs=this.querySelectorAll('button');for(var i=0;i<bs.length;i++)bs[i].classList.toggle('on',bs[i]===b);pkShow()});
  document.getElementById('pkX').addEventListener('click',pkClose);
  document.addEventListener('keydown',function(ev){if(ev.key==='Escape')pkClose()});
  document.getElementById('saPick').addEventListener('click',function(){pkPick('kr',function(it){saEl('saI').value=it.name;if(!saWorker()){saGo();return}var my=++saTok;saRun(it.code,it.name,my)})});
  document.getElementById('saPickUs').addEventListener('click',function(){pkPick('us',function(it){
    var rc=it.code||(it.sym+'.O');saEl('saI').value=it.name;
    if(!saWorker()){saEl('saO').innerHTML='<div class="sas sae">분석 서버 주소가 아직 설정되지 않았습니다. 아래에서 Worker 주소를 한 번 저장해 주세요.</div>';saCfgRender();return}
    var my=++saTok;saRun(rc,it.name,my,true)})});
})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
</body>
